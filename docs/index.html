<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111313"><meta name="description" content="Track your Steam achievements and find your next game to complete.">
  <title>Checkpoint · Steam achievements</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css?v=10"><link rel="stylesheet" href="/polish.css?v=16"><script type="module" src="/app.js?v=23"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#library" aria-label="Checkpoint home"><span class="brand-icon" aria-hidden="true">c<span>·</span></span><span>checkpoint<span class="brand-dot">.</span></span></a>
    <nav id="desktop-nav" aria-label="Main navigation"></nav>

    <button class="profile-button" data-action="connect"><span class="avatar" id="avatar">p1</span><span><strong id="profile-name">Player one</strong><small id="profile-mode">Exploring the demo</small></span><span class="profile-dots">···</span></button>
  </aside>

    <header class="topbar"><a class="mobile-brand" href="#library">c<span>·</span></a><span class="breadcrumb"><b id="breadcrumb">Library</b></span><div class="top-actions"><span id="source-badge" class="source-badge"><i></i> Demo profile</span><button class="connect-button" data-action="connect"><span class="steam-mark" aria-hidden="true">◉</span><span id="connect-label">Connect Steam</span><span aria-hidden="true">↗</span></button></div></header>
    <main id="main" tabindex="-1"></main>

  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  <dialog id="connect-dialog" aria-labelledby="connect-title"></dialog>
  <dialog id="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="hidden-dialog" aria-labelledby="hidden-title"></dialog>
  <dialog id="availability-dialog" class="availability-dialog" aria-labelledby="availability-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
