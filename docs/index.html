<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111313"><meta name="description" content="Track your Steam achievements and find your next game to complete.">
  <title>SteamAchieve · Steam achievements</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1"><meta name="apple-mobile-web-app-title" content="SteamAchieve"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg?v=3" type="image/svg+xml"><link rel="stylesheet" href="/style.css?v=10"><link rel="stylesheet" href="/polish.css?v=25"><script type="module" src="/app.js?v=31"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#library" aria-label="SteamAchieve home"><img class="brand-icon" src="/icon.svg?v=3" alt="" width="32" height="32"><span>SteamAchieve</span></a>
    <nav id="desktop-nav" aria-label="Main navigation"></nav>

    <button class="profile-button" data-action="connect"><span class="avatar" id="avatar">p1</span><span><strong id="profile-name">Player one</strong><small id="profile-mode">Exploring the demo</small></span><span class="profile-dots">···</span></button>
  </aside>
  <div class="workspace">
    <header class="topbar"><a class="mobile-brand" href="#library" aria-label="SteamAchieve home"><img src="/icon.svg?v=3" alt="" width="32" height="32"></a><span class="breadcrumb"><b id="breadcrumb">Library</b></span><div class="top-actions"><span id="source-badge" class="source-badge"><i></i> Demo profile</span><button class="connect-button" data-action="connect"><span class="steam-mark" aria-hidden="true">◉</span><span id="connect-label">Connect Steam</span><span aria-hidden="true">↗</span></button></div></header>
    <main id="main" tabindex="-1"></main>

  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  <dialog id="connect-dialog" aria-labelledby="connect-title"></dialog>
  <dialog id="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="hidden-dialog" aria-labelledby="hidden-title"></dialog>
  <dialog id="availability-dialog" class="availability-dialog" aria-labelledby="availability-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
